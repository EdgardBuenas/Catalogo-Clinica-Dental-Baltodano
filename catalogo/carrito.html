<!-- =====================================================
     MODAL CARRITO
===================================================== -->
<div class="modal fade modal-carrito" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow">
            
            <!-- HEADER -->
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalCarritoLabel">
                    <i class="fa-solid fa-cart-shopping text-primary me-2"></i> Mi carrito
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <!-- BODY -->
            <div class="modal-body">
                <div id="carritoVacio" class="text-center py-4">
                    <i class="fa-solid fa-cart-shopping text-secondary fs-1 mb-3"></i>
                    <p class="text-muted mb-0">Tu carrito está vacío.</p>
                </div>
                <div id="contenidoCarrito"></div>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer d-block">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold">Total</span>
                    <span id="totalCarrito" class="fw-bold text-primary fs-5">$ 0.00</span>
                </div>
                <button type="button" id="btnEnviarWhatsApp" class="btn btn-success w-100 fw-semibold text-white">
                    <i class="fa-brands fa-whatsapp me-2"></i> Enviar pedido por WhatsApp
                </button>
            </div>

        </div>
    </div>
</div>

<!-- =====================================================
     TOAST NOTIFICACIÓN
===================================================== -->
<div class="toast-container position-fixed top-0 end-0 p-0" style="z-index: 1100; margin-top: 60px; margin-right: 20px;">
    <div id="toastCarrito" class="toast toast-carrito border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-barra"></div>
        <div class="toast-body d-flex align-items-center gap-3">
            <div class="toast-icon"><i class="fa-solid fa-check"></i></div>
            <div class="toast-contenido flex-grow-1">
                <span class="toast-titulo">Producto agregado</span>
                <span class="toast-mensaje">Producto agregado al carrito</span>
            </div>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>

<!-- =====================================================
     MODAL ZOOM DE IMAGEN (Con la X dentro de los límites)
===================================================== -->
<div class="modal fade modal-imagen-zoom" id="modalImagenZoom" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content bg-transparent border-0 shadow-none">
            <div class="modal-body p-0 text-center">
                
                <!-- Contenedor estricto que envuelve la imagen y la X simultáneamente -->
                <div class="imagen-zoom-contenedor position-relative d-inline-block">
                    <img id="imagenZoomSrc" src="" class="img-fluid rounded shadow-lg" alt="Imagen ampliada">
                    
                    <button type="button" class="btn-cerrar-imagen" data-bs-dismiss="modal" aria-label="Cerrar">
                        <i class="fa-solid fa-xmark text-dark"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
