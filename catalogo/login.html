<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración - Club Dental</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="icon"
          type="image/x-icon"
          href="Logo-1.png">

    <style>

        html {
            scrollbar-width: thin;
            scrollbar-color: #01ACEE #F1F5F4;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F6F8FA;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #F1F5F4;
        }

        ::-webkit-scrollbar-thumb {
            background: #01ACEE;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0081B4;
        }

        /* LOGIN */

        .login-card {
            width: 100%;
            max-width: 370px;
            background: #FFFFFF;
            border: 1px solid #E9ECEF;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .06);
        }

        .login-logo {
            width: 175px;
            display: block;
            margin: 0 auto 22px;
        }

        .login-titulo {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
        }

        .login-subtitulo {
            font-size: 12px;
            color: #6C757D;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-control {
            height: 40px;
            padding: 8px 11px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #DEE2E6;
        }

        .form-control:focus {
            border-color: #01ACEE;
            box-shadow: 0 0 0 .15rem rgba(1, 172, 238, .12);
        }

        .btn-login {
            height: 40px;
            background: #01ACEE;
            border: 1px solid #01ACEE;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            transition: all .2s ease;
        }

        .btn-login:hover {
            background: #009BD8;
            border-color: #009BD8;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        #mensaje {
            display: none;
            font-size: 13px;
            padding: 9px 11px;
            border-radius: 6px;
        }

        @media (max-width: 575.98px) {

            body {
                padding: 15px;
            }

            .login-card {
                max-width: 360px;
                padding: 24px 20px;
                border-radius: 8px;
            }

            .login-logo {
                width: 155px;
                margin-bottom: 20px;
            }

            .login-titulo {
                font-size: 17px;
            }

        }

    </style>

</head>

<body>

    <div class="login-card">

        <img src="Logo-2.png"
             class="login-logo"
             alt="Club Dental">

        <div class="text-center mb-4">

            <div class="login-titulo">
                Administración
            </div>

            <div class="login-subtitulo mt-1">
                Accede al panel de administración
            </div>

        </div>

        <div id="mensaje"
             class="alert">
        </div>

        <form id="formLogin">

            <div class="mb-3">

                <label for="usuario"
                       class="form-label">

                    Usuario

                </label>

                <input type="text"
                       id="usuario"
                       class="form-control"
                       autocomplete="username"
                       required>

            </div>

            <div class="mb-3">

                <label for="contrasena"
                       class="form-label">

                    Contraseña

                </label>

                <input type="password"
                       id="contrasena"
                       class="form-control"
                       autocomplete="current-password"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-login w-100">

                <i class="fa-solid fa-right-to-bracket me-1"></i>
                Iniciar sesión

            </button>

        </form>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>
    <script src="login.js"></script>

</body>

</html>
